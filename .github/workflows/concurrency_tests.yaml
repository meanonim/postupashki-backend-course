name: Concurrency tests

on:
  push:
    branches: [ "main" ]

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file:: concurrency/go.mod
        cache: false

    - name: Make all
      working-directory: concurrency
      run: make all
