name: Tests

on:
  push:
    branches: [ "main" ]

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.x"
        cache: false

  # tests
    - name: Concurrency Tests
      working-directory: concurrency
      run: make all

    - name: Networks Tests
      if: ${{ !cancelled() }}
      working-directory: networks
      run: make 01 03 05

